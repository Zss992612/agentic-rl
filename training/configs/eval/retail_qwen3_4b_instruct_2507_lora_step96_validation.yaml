experiment_name: retail_qwen3_4b_instruct_2507_lora_step96_validation

domain: retail
evaluation_type: env

task_selection:
  split_file: configs/data/retail_split.yaml
  split_name: validation
  num_tasks: 10

server:
  model_path: Qwen/Qwen3-4B-Instruct-2507
  api_base: http://127.0.0.1:8000/v1
  api_key: EMPTY
  tensor_parallel_size: 1
  max_model_len: 17408
  gpu_memory_utilization: 0.9
  tool_call_parser: hermes

agent:
  model: openai/retail-sft-step96
  temperature: 0.7
  top_p: 0.8
  max_tokens: 2048
  parallel_tool_calls: false
  extra_body:
    top_k: 20

user:
  model: openai/deepseek-v4-flash
  api_base: https://opencode.ai/zen/go/v1
  temperature: 0.0

sampling:
  num_trials: 1
  max_concurrency: 1
  seed: 300
