[project]
name = "agentic-rl-training"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pillow>=12.3.0",
    "tau2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rl"]

[tool.uv.sources]
tau2 = { path = "../tau2-bench", editable = true }

[dependency-groups]
dev = ["pytest>=8.3.5"]
preprocessing = [
    "numpy>=2,<3",
    "transformers>=4.51,<5",
]
sft = [
    "numpy>=2,<3",
    "peft>=0.17,<1",
    "pyyaml>=6,<7",
    "torch>=2.7,<3",
    "transformers>=4.51,<5",
    "wandb>=0.19,<1",
]
