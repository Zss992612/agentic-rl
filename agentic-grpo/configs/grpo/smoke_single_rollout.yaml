experiment:
  name: tau2_retail_single_rollout

paths:
  model_env: AGENTIC_RL_MODEL_PATH
  lora_adapter_env: AGENTIC_RL_LORA_PATH
  chat_template: artifacts/chat_templates/qwen3_4b_no_think.jinja
  agent_loop_config: configs/grpo/agent_loops/tau2_retail.yaml
  task_file: data/grpo/smoke/task_10.jsonl
  output_dir: outputs/grpo/smoke_single_rollout

data:
  task_id: "10"
  tau2_seed: 300
  max_prompt_length: 8192
  max_response_length: 24576

model:
  lora_rank: 16
  lora_alpha: 32
  target_modules: all-linear
  attn_implementation: sdpa
  use_remove_padding: false

rollout:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.6
  max_model_len: 32768
  max_num_batched_tokens: 32768
  max_num_seqs: 8
  log_prob_micro_batch_size_per_gpu: 1
  agent_loop_workers: 1

trainer:
  n_gpus_per_node: 1
  nnodes: 1
