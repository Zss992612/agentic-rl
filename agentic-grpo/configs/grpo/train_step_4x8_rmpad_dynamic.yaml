experiment:
  name: tau2_retail_grpo_step_4x8_lmhead_bypass_rmpad_dynamic32k

paths:
  model_env: AGENTIC_RL_MODEL_PATH
  lora_adapter_env: AGENTIC_RL_LORA_PATH
  chat_template: artifacts/chat_templates/qwen3_4b_no_think.jinja
  agent_loop_config: configs/grpo/agent_loops/tau2_retail.yaml
  task_file: data/grpo/train_step_4x8/tasks.jsonl
  output_dir: outputs/grpo/train_step_4x8_lmhead_bypass_rmpad_dynamic32k

data:
  train_batch_size: 4
  dataloader_num_workers: 0
  max_prompt_length: 6144
  max_response_length: 12288

model:
  lora_rank: 16
  lora_alpha: 32
  target_modules: all-linear
  attn_implementation: flash_attention_2
  use_remove_padding: true
  use_fused_kernels: true
  fused_kernel_backend: torch

actor:
  learning_rate: 1.0e-6
  ppo_mini_batch_size: 4
  use_dynamic_bsz: true
  ppo_epochs: 1
  ppo_max_token_len_per_gpu: 32768
  use_torch_compile: false
  checkpoint_save_contents:
    - optimizer
    - extra
  checkpoint_load_contents:
    - optimizer
    - extra

rollout:
  n: 8
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.6
  max_model_len: 18432
  max_num_batched_tokens: 18432
  max_num_seqs: 8
  log_prob_use_dynamic_bsz: true
  log_prob_max_token_len_per_gpu: 32768
  agent_loop_workers: 8
  calculate_log_probs: true

algorithm:
  bypass_mode: true

trainer:
  total_training_steps: 1
  save_freq: 1
  n_gpus_per_node: 1
  nnodes: 1
